<!DOCTYPE html>
<html>

<head>
    <title>Reset Password</title>
</head>

<body>

    <h1>Reset Password</h1>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <form method="POST">

        <label for="password">New Password</label>
        <input
            type="password"
            id="password"
            name="password"
            required
        >

        <label for="confirm_password">Confirm New Password</label>
        <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            required
        >

        <button type="submit">
            Reset Password
        </button>

    </form>

    <p>
        <a href="/login">
            Back to Login
        </a>
    </p>

</body>

</html>
