<!DOCTYPE html>
<html>

<head>
    <title>Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <main>

        <h1>Create Account</h1>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <p class="flash-message">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form action="/register" method="POST">

            <label for="display_name">Display Name</label>
            <input
                type="text"
                id="display_name"
                name="display_name"
                required
            >

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                required
            >

            <label for="password">Password</label>

            <div class="password-input">
                <input
                    type="password"
                    id="password"
                    name="password"
                    minlength="8"
                    required
                >

                <button
                    type="button"
                    class="toggle-password"
                    data-target="password"
                >
                    <img
                        src="{{ url_for('static', filename='images/eye_icon.png') }}"
                        alt=""
                    >
                </button>
            </div>

            <div class="password-requirements">
                <p id="password-status">Password requirements:</p>

                <div id="length-check" class="password-check">
                    <span class="check-light"></span>
                    <span>At least 8 characters</span>
                </div>

                <div id="uppercase-check" class="password-check">
                    <span class="check-light"></span>
                    <span>Uppercase letter</span>
                </div>

                <div id="lowercase-check" class="password-check">
                    <span class="check-light"></span>
                    <span>Lowercase letter</span>
                </div>

                <div id="number-check" class="password-check">
                    <span class="check-light"></span>
                    <span>Number</span>
                </div>

                <div id="special-check" class="password-check">
                    <span class="check-light"></span>
                    <span>Special character</span>
                </div>
            </div>

            <label for="confirm_password">Confirm Password</label>

            <div class="password-input">
                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    minlength="8"
                    required
                >

                <button
                    type="button"
                    class="toggle-password"
                    data-target="confirm_password"
                >
                    <img
                        src="{{ url_for('static', filename='images/eye_icon.png') }}"
                        alt=""
                    >
                </button>
            </div>

            <button type="submit">
                Register
            </button>

        </form>

        <div class="form-links">

            <p>
                Already have an account?
                <a href="/login">
                    Login
                </a>
            </p>

        </div>

    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
