<!DOCTYPE html>

<html>

<head>
    <title>Login</title>
</head>

<body>

```
<h1>Login</h1>

{% with messages = get_flashed_messages() %}
    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}
{% endwith %}

<form action="/login" method="POST">

    <label for="email">Email</label>
    <input
        type="email"
        id="email"
        name="email"
        required
    >

    <label for="password">Password</label>
    <input
        type="password"
        id="password"
        name="password"
        required
    >

    <button type="submit">
        Login
    </button>

</form>

<p>
    <a href="/forgot-password">
        Forgot Password?
    </a>
</p>

<p>
    Don't have an account?
    <a href="/register">
        Register
    </a>
</p>
```

</body>

</html>
